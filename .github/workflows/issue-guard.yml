name: issue-guard
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이슈와 댓글 본문 검사
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | python3 scripts/check_public.py text
